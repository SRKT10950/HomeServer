name: Release Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-executable:
    name: Publish HomeServer.exe Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-windows-x64
          path: homeserver.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HomeServer Release v1.0.${{ github.run_number }}
          body: |
            Production release of `homeserver.exe`.
            
            ### Download
            Direct standalone Windows executable ready for deployment.
          files: homeserver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
