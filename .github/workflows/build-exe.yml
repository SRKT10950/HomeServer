name: Release Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-executable:
    name: Build & Publish HomeServer.exe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Package Executable
        run: npm run package

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version || '1.0.0')")
          echo "VERSION_NAME=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Publish Executable to app.mhservice.co.in
        run: |
          echo "Publishing version ${VERSION_NAME} (code: ${VERSION_CODE}) to https://app.mhservice.co.in..."
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          # Check if package co.in.mhservice.homeserver is registered
          CHECK_STATUS=$(curl -s -L -A "$UA" -o /dev/null -w "%{http_code}" https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver)
          echo "Package lookup HTTP Status Code: ${CHECK_STATUS}"

          if [ "$CHECK_STATUS" -eq 404 ]; then
            echo "Package co.in.mhservice.homeserver not found. Creating new app entry on app.mhservice.co.in..."
            HTTP_STATUS=$(curl -s -L -A "$UA" -o response.json -w "%{http_code}" -X POST https://app.mhservice.co.in/api/apps \
              -F "name=HomeServer" \
              -F "packageName=co.in.mhservice.homeserver" \
              -F "category=Tools" \
              -F "description=HomeServer Windows Standalone Service & App" \
              -F "versionName=${VERSION_NAME}" \
              -F "versionCode=${VERSION_CODE}" \
              -F "changelog=Initial release build #${VERSION_CODE}" \
              -F "apk=@homeserver.exe")
          else
            echo "Package co.in.mhservice.homeserver exists. Publishing version update..."
            HTTP_STATUS=$(curl -s -L -A "$UA" -o response.json -w "%{http_code}" -X POST https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver/version \
              -F "versionName=${VERSION_NAME}" \
              -F "versionCode=${VERSION_CODE}" \
              -F "changelog=Automated release build #${VERSION_CODE}" \
              -F "apk=@homeserver.exe")
          fi
          
          echo "Publish HTTP Status Code: ${HTTP_STATUS}"
          cat response.json
          echo ""

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-windows-x64
          path: homeserver.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "HomeServer Latest Production Release"
          make_latest: "true"
          body: |
            ### 🚀 HomeServer Standalone Windows Executable
            
            This is the latest production package of `homeserver.exe`.
            
            - **Direct Download (app.mhservice.co.in)**: [https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver/download](https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver/download)
            - **GitHub Release Download**: [homeserver.exe](https://github.com/SRKT10950/HomeServer/releases/latest/download/homeserver.exe)
          files: homeserver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
