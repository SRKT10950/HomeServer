name: Release Windows Executable

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-executable:
    name: Build & Publish HomeServer.exe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Package Executable
        run: npm run package

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version || '1.0.0')")
          echo "VERSION_NAME=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Publish Executable to app.mhservice.co.in
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          SERVER_URL="https://app.mhservice.co.in"
          PACKAGE_NAME="co.in.mhservice.homeserver"

          echo "Publishing version ${VERSION_NAME} (code: ${VERSION_CODE}) to ${SERVER_URL}..."

          # Check package status (Returns 200 if exists, 404 if not found, 403 if Cloudflare blocked)
          CHECK_STATUS=$(curl -s -L -A "$UA" -o /dev/null -w "%{http_code}" "${SERVER_URL}/api/apps/package/${PACKAGE_NAME}")
          echo "Package lookup HTTP Status Code: ${CHECK_STATUS}"

          if [ "$CHECK_STATUS" -eq 403 ]; then
            echo "❌ Cloudflare WAF blocked the request (HTTP 403)."
            echo "Please deploy a Custom WAF Skip Rule in Cloudflare Dashboard for URI path '/api/'"
            exit 1

          elif [ "$CHECK_STATUS" -eq 404 ]; then
            echo "Package '${PACKAGE_NAME}' not found. Registering new app entry..."
            HTTP_STATUS=$(curl -s -L -A "$UA" -o response.json -w "%{http_code}" -X POST "${SERVER_URL}/api/apps" \
              -F "name=HomeServer" \
              -F "packageName=${PACKAGE_NAME}" \
              -F "category=Tools" \
              -F "description=HomeServer Windows Standalone Service & App" \
              -F "versionName=${VERSION_NAME}" \
              -F "versionCode=${VERSION_CODE}" \
              -F "changelog=Initial release build #${VERSION_CODE}" \
              -F "apk=@homeserver.exe")

          elif [ "$CHECK_STATUS" -eq 200 ]; then
            echo "Package '${PACKAGE_NAME}' exists. Publishing version update..."
            HTTP_STATUS=$(curl -s -L -A "$UA" -o response.json -w "%{http_code}" -X POST "${SERVER_URL}/api/apps/package/${PACKAGE_NAME}/version" \
              -F "versionName=${VERSION_NAME}" \
              -F "versionCode=${VERSION_CODE}" \
              -F "changelog=Automated release build #${VERSION_CODE}" \
              -F "apk=@homeserver.exe")

          else
            echo "Unexpected HTTP Status: ${CHECK_STATUS}"
            exit 1
          fi

          echo "Publish HTTP Status Code: ${HTTP_STATUS}"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "❌ Publish failed with status ${HTTP_STATUS}"
            exit 1
          fi

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-windows-x64
          path: homeserver.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "HomeServer Latest Production Release"
          make_latest: "true"
          body: |
            ### 🚀 HomeServer Standalone Windows Executable
            
            This is the latest production package of `homeserver.exe`.
            
            - **Direct Download (app.mhservice.co.in)**: [https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver/download](https://app.mhservice.co.in/api/apps/package/co.in.mhservice.homeserver/download)
            - **GitHub Release Download**: [https://github.com/SRKT10950/HomeServer/releases/latest/download/homeserver.exe](https://github.com/SRKT10950/HomeServer/releases/latest/download/homeserver.exe)
          files: homeserver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
