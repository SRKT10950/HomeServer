name: Release Windows Executable

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-executable:
    name: Build & Release HomeServer.exe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Package Executable
        run: npm run package

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-windows-x64
          path: homeserver.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "HomeServer Latest Production Release"
          make_latest: "true"
          body: |
            ### 🚀 HomeServer Standalone Windows Executable
            
            This is the latest production package of `homeserver.exe`.
            
            - **Direct Download**: [homeserver.exe](https://github.com/SRKT10950/HomeServer/releases/latest/download/homeserver.exe)
          files: homeserver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
