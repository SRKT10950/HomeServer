name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-executable:
    name: Build HomeServer EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: npm run install:all

      - name: Build Client & Package Executable
        run: npm run package

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-windows-x64
          path: homeserver.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HomeServer Release v1.0.${{ github.run_number }}
          body: |
            Automated production build generated from merge to `main`.
            
            ### Included Artifacts
            - `homeserver.exe` (Windows x64 Standalone Executable)
          files: homeserver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
